# Nginx configuration for the frontend
# 1. Listen on port 80
# 2. Set the root directory to /usr/share/nginx/html and the index file to index.html
# 3. Proxy requests to /api/ to the backend service
# 4. Serve the frontend application for all other requests
# Basically in my eyes a SPA fallback controller class 

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
