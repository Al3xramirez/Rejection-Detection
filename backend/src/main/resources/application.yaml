spring:
  application:
    name: project

  datasource:
    url: jdbc:mysql://localhost:3306/rejection_detection
    username: ${REJECTION_DETECTION_DB_USERNAME}
    password: ${REJECTION_DETECTION_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

